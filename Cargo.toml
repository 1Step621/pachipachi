[package]
name = "pachipachi"
version = "0.1.0"
edition = "2024"
description = "A typing pet overlay for Linux Wayland"

[dependencies]
anyhow = "1"
async-channel = "2"
clap = { version = "4", features = ["derive"] }
evdev = "0.13.2"
gpui = { package = "gpui-pre", version = "=0.3.7", default-features = false }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.7", features = ["wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
nix = { version = "0.29", features = ["poll"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0

[profile.release]
strip = true
